<mat-card class="login-card">
  <mat-card-header>
    <mat-card-title>Login</mat-card-title>
  </mat-card-header>

  <form (ngSubmit)="login()">
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Usuário</mat-label>
        <input matInput name="username" [(ngModel)]="username" autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input
          matInput
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
        />
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button mat-flat-button color="primary" type="submit">Entrar</button>
    </mat-card-actions>
  </form>
</mat-card>

<mat-card class="login-card">
  <mat-card-header>
    <mat-card-title>Login</mat-card-title>
  </mat-card-header>

  <form (ngSubmit)="login()">
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Usuário</mat-label>
        <input
          matInput
          name="username"
          data-test="username"
          [(ngModel)]="username"
          autocomplete="username"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input
          matInput
          type="password"
          name="password"
          data-test="password"
          [(ngModel)]="password"
          autocomplete="current-password"
        />
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button mat-flat-button color="primary" type="submit" data-test="login-button">
        Entrar
      </button>
    </mat-card-actions>
  </form>
</mat-card>

@if (showCredentials) {
  <mat-card class="credentials-card" appearance="outlined">
    <mat-card-content class="credentials">
      <section>
        <h3>Usuários aceitos:</h3>
        <mat-list dense>
          @for (name of mockUsernames; track name) {
            <mat-list-item>{{ name }}</mat-list-item>
          }
        </mat-list>
      </section>

      <section>
        <h3>Senha para todos os usuários:</h3>
        <mat-list dense>
          <mat-list-item>{{ mockPassword }}</mat-list-item>
        </mat-list>
      </section>
    </mat-card-content>
  </mat-card>
}
